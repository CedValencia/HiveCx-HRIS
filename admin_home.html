<!DOCTYPE html>
<!--
  HR Admin · Dashboard
  HR admin home: headcount, attendance today, approvals, birthdays, recent hires.
  Shared pieces (data, sidebar/top bar, payroll + leave engines, helpers) live in js/core.js and css/hive.css.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Admin · Dashboard · Hive HRIS</title>
<script>try{var t=localStorage.getItem("hive.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="css/hive.css">
</head>
<body>
<div id="root"></div><div id="sc"></div><div id="md"></div><div id="ts"></div>

<script>window.HIVE_PAGE={role:"adm",page:"dashboard"};</script>
<script src="js/core.js"></script>
<script>
"use strict";
/* ===== HR Admin · Dashboard — this page's screen ===== */
/* ---------- ADMIN ---------- */
function donut(){const c=["var(--ac)","var(--tx)","var(--ok)","var(--mut)","var(--bad)"];let o=0;const t=emps.length||1;
  return`<svg viewBox="0 0 120 120" style="width:150px;display:block;margin:10px 0"><circle cx="60" cy="60" r="42" fill="none" stroke="var(--line)" stroke-width="14"/>${D.map((d,k)=>{const n=emps.filter(e=>e.d===d).length,p=n/t*100,x=n?`<circle cx="60" cy="60" r="42" pathLength="100" fill="none" stroke="${c[k]}" stroke-width="14" stroke-dasharray="${Math.max(p-1,0)} ${101-p}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`:"";o+=p;return x}).join("")}<text x="60" y="66" text-anchor="middle" style="fill:var(--tx);font:600 22px system-ui">${t}</text></svg>
  <div class="leg">${D.map((d,k)=>`<span><i style="background:${c[k]}"></i>${d}</span>`).join("")}</div>`}

function admDash(){
  const bd=emps.filter(e=>e.b&&!e.pend&&e.b>="11-19").sort((a,b)=>a.b>b.b?1:-1).slice(0,3),
        nh=emps.filter(e=>e.j>="2025-10-01"),pres=todayLogs().length;
  return head("HR Admin / Dashboard",`The whole team,<br><em>at a glance.</em>`,"Headcount, attendance, approvals, and payroll for today.")
  +`<div class="grid g4">
      ${stat("FIG 0.1","Headcount",emps.length)}
      ${stat("FIG 0.2","Present today",`<span>${pres}</span>/${emps.length}`)}
      ${stat("FIG 0.3","Pending approvals",pend())}
      ${stat("FIG 0.4","Next payroll",`<span style="font-size:26px">${PHP(emps.reduce((a,e)=>a+pay(e,periods()[0].label).g,0))}</span>`)}
    </div>
    <div class="grid g2 mt">
      <div class="card"><div class="fig">BY DEPARTMENT</div><h3>Headcount mix</h3>${donut()}</div>
      <div class="card"><div class="fig">THIS WEEK</div><h3>Attendance %</h3>${line()}</div>
    </div>
    <div class="grid g2 mt">
      <div class="card"><div class="fig">UPCOMING</div><h3>Birthdays</h3>${bd.map(e=>`<div class="ls">${who(e)} <span class="mut">· ${e.b}</span></div>`).join("")||"<p class='mut'>None soon.</p>"}</div>
      <div class="card"><div class="fig">NEW</div><h3>Recent hires</h3>${nh.map(e=>`<div class="ls">${who(e)} <span class="mut">· ${esc(e.r)}</span></div>`).join("")||"<p class='mut'>None.</p>"}</div>
    </div>`;
}

/* ===== start ===== */
HIVE.view=admDash;
hiveStart();
</script>
</body></html>
