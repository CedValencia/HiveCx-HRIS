<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hive HRIS</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0b0b0a;--panel:#141412;--panel2:#1b1b18;--line:#2a2a26;
  --tx:#f2efe6;--mut:#8f8b7e;--ac:#f5b301;--acx:#0b0b0a;
  --ok:#6fcf97;--bad:#ef6a5b;--warn:#eab308;--info:#5b9df9;--inc:#f08a3c;
  --r:16px;--rsm:11px;--sh:0 14px 34px -22px rgba(0,0,0,.75);--side:248px;
  --leave:#a78bfa;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){
  --bg:#f6f3ea;--panel:#fff;--panel2:#faf8f1;--line:#ddd8c8;--tx:#161612;--mut:#6d695c;
  --ac:#c98f00;--acx:#fff;--ok:#1f8a4c;--bad:#c43d2e;--warn:#a97a00;--info:#2f6fbf;--inc:#c26a1c;--leave:#7c5cf0;
  --sh:0 14px 34px -24px rgba(60,50,20,.4)}
}
:root[data-theme="light"]{
  --bg:#f6f3ea;--panel:#fff;--panel2:#faf8f1;--line:#ddd8c8;--tx:#161612;--mut:#6d695c;
  --ac:#c98f00;--acx:#fff;--ok:#1f8a4c;--bad:#c43d2e;--warn:#a97a00;--info:#2f6fbf;--inc:#c26a1c;--leave:#7c5cf0;
  --sh:0 14px 34px -24px rgba(60,50,20,.4)
}
:root[data-theme="dark"]{
  --bg:#0b0b0a;--panel:#141412;--panel2:#1b1b18;--line:#2a2a26;--tx:#f2efe6;--mut:#8f8b7e;
  --ac:#f5b301;--acx:#0b0b0a;--ok:#6fcf97;--bad:#ef6a5b;--warn:#eab308;--info:#5b9df9;--inc:#f08a3c;--leave:#a78bfa
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(60% 40% at 12% 0%,color-mix(in srgb,var(--ac) 13%,transparent),transparent 70%) var(--bg) no-repeat fixed;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
::selection{background:var(--ac);color:var(--acx)}
[hidden]{display:none!important}
.mut{color:var(--mut)}.r{text-align:right}
.fig,.eyebrow,th{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.eyebrow{display:block;margin-bottom:6px}
h1{font-size:clamp(28px,4.6vw,46px);line-height:1.05;letter-spacing:-.035em;margin:10px 0 8px;font-weight:600}
h1 em{font-style:normal;color:var(--ac)}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 4px}
h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.lead{color:var(--mut);max-width:620px;margin:0 0 26px}
.i{width:17px;height:17px;flex:none;stroke-width:1.8}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);z-index:40;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;letter-spacing:-.01em}
.brand i,.hxi{width:26px;height:26px;background:var(--ac);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);display:block;flex:none}
.brand small{display:block;color:var(--mut);font:400 10px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:400}
.navgrp{padding:6px 10px;flex:1;overflow-y:auto}
.navgrp .fig{padding:12px 10px 6px}
.ni{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--mut);
  font-size:14px;margin-bottom:2px;transition:background .2s,color .2s;cursor:pointer;border:0;width:100%;background:none;text-align:left}
.ni:hover{background:var(--panel2);color:var(--tx)}
.ni.on{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--tx);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
.ni.on .i{color:var(--ac)}
.sidefoot{border-top:1px solid var(--line);padding:12px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who b{display:block;font-size:13.5px;line-height:1.2}
.who span{font-size:11.5px;color:var(--mut)}
.main{flex:1;min-width:0;margin-left:var(--side);display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:58px;padding:0 22px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{font:11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.crumb b{color:var(--tx);font-weight:600}
.bar .sp{flex:1}
main#app{width:100%;max-width:1160px;margin:0 auto;padding:30px 24px 90px;flex:1}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);cursor:pointer;position:relative;transition:border-color .2s,transform .2s;padding:0}
.ib:hover{border-color:var(--ac);transform:translateY(-1px)}
.ib .i{width:18px;height:18px}
.ib b{position:absolute;top:-6px;right:-6px;background:var(--ac);color:var(--acx);border-radius:99px;font-size:10px;padding:1px 5px;font-weight:700;border:2px solid var(--bg)}
#sc{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
body.menu-open #sc{opacity:1;pointer-events:auto}
.burger{display:none}

/* ============ CARDS / STATS ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mt{margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;
  box-shadow:var(--sh);transition:border-color .3s}
.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.card.flat:hover{border-color:var(--line)}
.card h3{margin-bottom:2px}
.cardhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.big{font-size:38px;letter-spacing:-.04em;font-weight:600;margin-top:10px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--ac)}
.stat .fig{margin-bottom:2px}
.stat .big{font-size:30px}
.stat small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.bar b{flex:0 0 118px;font-weight:400;color:var(--mut)}
.bar div{height:8px;border-radius:9px;background:var(--ac);transform-origin:left;animation:grow .9s backwards}
@keyframes grow{from{transform:scaleX(0)}}

/* ============ TABLES / TAGS ============ */
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line);
  font-size:11px;font-weight:600;margin-right:8px;vertical-align:middle;flex:none}
.av.lg{width:56px;height:56px;font-size:19px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tag.wait{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 55%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 55%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* ============ BUTTONS / FORMS ============ */
button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--line);background:transparent;padding:8px 15px;border-radius:99px;
  transition:transform .2s,border-color .2s,background .2s;font-size:14px}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.pri:hover:not(:disabled){background:color-mix(in srgb,var(--ac) 85%,#fff)}
button.sm{padding:5px 12px;font-size:13px}
button.wide{width:100%;padding:11px}
button.lnk{border:0;background:none;padding:0;color:var(--ac);text-decoration:underline;text-underline-offset:3px}
button.lnk:hover{transform:none;border:0}
button.dngr:hover{border-color:var(--bad);color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--rsm);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mut) 75%,transparent)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-top:14px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:5px}
label .req{color:var(--ac)}
.full{grid-column:1/-1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.row.between{justify-content:space-between}
.pw{position:relative;display:flex}
.pw input{padding-right:56px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:3px 9px;font-size:12px;border-radius:8px;background:var(--panel)}
.pw button:hover{transform:translateY(-50%)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:0;cursor:pointer}
.chk input{width:auto;accent-color:var(--ac)}
.err-box{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:var(--rsm);
  background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
  color:var(--bad);font-size:13.5px;animation:up .3s}
.err-box .i{margin-top:2px}
.hintbox{grid-column:1/-1;font-size:12.5px;color:var(--mut);background:var(--panel2);border:1px dashed var(--line);border-radius:var(--rsm);padding:9px 12px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid color-mix(in srgb,var(--acx) 35%,transparent);
  border-top-color:var(--acx);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ LOGIN ============ */
.login{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:stretch;min-height:calc(100vh - 60px);padding:14px 0}
.login__art{background:linear-gradient(160deg,var(--panel),color-mix(in srgb,var(--ac) 9%,var(--panel)));
  border:1px solid var(--line);border-radius:22px;padding:34px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login__art h1{font-size:clamp(30px,3.6vw,44px)}
.login__art ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:11px}
.login__art li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mut)}
.login__art li .i{color:var(--ac)}
.login__art svg.hex{width:100%;max-height:230px;margin-top:20px;animation:flt 7s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
.login__form{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--sh);align-self:center}
.login__form .logo{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:20px}
.demo{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.demo .fig{margin-bottom:9px}
.demo button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 13px;border-radius:12px;background:var(--panel2);font-size:13.5px}
.demo button:hover{border-color:var(--ac)}
.demo button b{display:block;font-size:13.5px}
.demo button span{color:var(--mut);font-size:12px}
.hx{fill:none;stroke:var(--line);stroke-width:1.2}
.hx.on{fill:color-mix(in srgb,var(--ac) 14%,transparent);stroke:var(--ac)}
.hx.core{fill:var(--ac);stroke:none}

/* ============ CLOCK / SHIFT ============ */
.clock{font-size:clamp(42px,7vw,58px);letter-spacing:-.04em;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1}
.clock small{font-size:.4em;color:var(--mut);font-weight:500;letter-spacing:0}
.shiftgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.shiftgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);padding:10px 12px}
.shiftgrid .fig{font-size:10px;margin-bottom:3px}
.shiftgrid b{font-size:15px;font-variant-numeric:tabular-nums}
.shiftgrid b.miss{color:var(--mut);font-weight:400}
.punch{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.punch button{flex:1;min-width:130px;padding:12px;font-weight:600}

/* ============ CALENDAR ============ */
.calhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.calhd h3{font-size:17px}
.calnav{display:flex;gap:6px;align-items:center}
.calnav button{padding:6px 11px;font-size:13px;border-radius:9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .h{border:0;min-height:0;padding:4px 2px;background:none;font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);text-align:center;cursor:default;transform:none}
.cal .h:hover{transform:none;border-color:transparent}
.day{min-height:58px;border:1px solid var(--line);border-radius:10px;padding:5px 6px 4px;font-size:12.5px;color:var(--mut);
  background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:1px;transition:border-color .2s,transform .15s,box-shadow .2s}
.day:hover:not(:disabled){border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh)}
.day small{font-size:10px;line-height:1.2;opacity:.95}
.day.blank{border:0;background:none;cursor:default;pointer-events:none}
.day.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
.day.sel{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 45%,transparent)}
.day.on{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--panel2))}
.day.late{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel2))}
.day.absent{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel2))}
.day.rest{border-color:var(--line);color:var(--mut);opacity:.62;background:var(--panel2)}
.day.hol{border-color:color-mix(in srgb,var(--info) 60%,transparent);color:var(--info);background:color-mix(in srgb,var(--info) 10%,var(--panel2))}
.day.inc{border-color:color-mix(in srgb,var(--inc) 65%,transparent);color:var(--inc);background:color-mix(in srgb,var(--inc) 10%,var(--panel2))}
.day.leave{border-color:color-mix(in srgb,var(--leave) 60%,transparent);color:var(--leave);background:color-mix(in srgb,var(--leave) 10%,var(--panel2))}
.day.future{opacity:.5}

/* ============ MISC BLOCKS ============ */
.announce{display:grid;gap:12px}
.an{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel2);position:relative;transition:border-color .25s,transform .25s}
.an:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--line));transform:translateY(-2px)}
.an.top{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--panel2)),var(--panel2));
  border-color:color-mix(in srgb,var(--ac) 45%,transparent);padding:18px 20px}
.an .anhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.an b{font-size:15.5px}
.an.top b{font-size:18px}
.an p{margin:4px 0 0;font-size:13.5px;color:var(--mut);line-height:1.55}
.an time{font-size:11.5px;color:var(--mut);font-family:ui-monospace,monospace}
.pin{position:absolute;top:-9px;right:14px;background:var(--ac);color:var(--acx);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:99px}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.welcome .big{margin-top:0}
.ev{display:flex;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .date{flex:none;width:56px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 2px}
.ev .date b{display:block;font-size:17px;line-height:1.1}
.ev .date span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.ev .txt{font-size:14px}
.ev .txt span{display:block;font-size:12px;color:var(--mut)}
.ls{padding:10px 0;border-bottom:1px solid var(--line)}
.ls:last-child{border-bottom:0}
.nitem{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;
  border-radius:10px;padding:10px 10px;margin:0 -10px;width:calc(100% + 20px);font-size:14px;cursor:pointer;transition:background .2s}
.nitem:hover{background:var(--panel2);transform:none;border:0}
.nitem .nd{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px}
.nitem.unread .nd{background:var(--ac)}
.nitem b{display:block;font-weight:600;font-size:14px}
.nitem span{color:var(--mut);font-size:13px;line-height:1.45}
.nitem time{display:block;font-size:11px;color:var(--mut);font-family:ui-monospace,monospace;margin-top:3px}
.nitem.unread b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:7px;vertical-align:2px}
.bellp{position:fixed;top:64px;right:16px;width:min(370px,calc(100vw - 32px));max-height:70vh;overflow:auto;
  z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 60px -25px rgba(0,0,0,.7);
  padding:16px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.bellp .fig{margin-bottom:6px}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.pol div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);padding:10px 12px}
.pol .fig{font-size:10px}
.pol b{font-size:16px}
.slipdoc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.slipdoc .sphd{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ac);padding-bottom:14px;margin-bottom:6px}
.slipdoc table{min-width:0}
.slipdoc tr.tot td{border-top:2px solid var(--line);font-weight:700;font-size:15px}
.slipdoc .net{font-size:26px;color:var(--ac);font-weight:700;letter-spacing:-.03em}
.docgrid{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;margin-top:10px}

  inc:"Incomplete",none:"Not yet recorded",future:"Scheduled",leave:"Approved leave"};
function workdaysOfMonth(y,m,sh){                           // all working days of a month
  const out=[],last=new Date(y,m+1,0).getDate();
  for(let d=1;d<=last;d++){const k=y+"-"+pad2(m+1)+"-"+pad2(d);
    if(!isRest(k,sh)&&!holOn(k))out.push(k)}
  return out;
}
const onLeave=(e,k)=>leaves.some(l=>l.e===e&&l.st==="Approved"&&k>=l.f&&k<=l.to);
function monthFacts(e,y,m){                                 // raw counts for a month
  const sh=shiftOf(e),days=workdaysOfMonth(y,m,sh).filter(k=>k<=Y);
  let on=0,late=0,lateMin=0,absent=0,inc=0,leave=0,consec=0,maxConsec=0;
  for(const k of days){
    const s=dayState(e,k);
    if(s.st==="on"){on++;consec=0}
    else if(s.st==="late"){late++;lateMin+=s.late;consec++;if(consec>maxConsec)maxConsec=consec}
    else if(s.st==="leave"){leave++;consec=0}
    else if(s.st==="absent"){absent++;consec=0}
    else if(s.st==="inc"){inc++;consec=0}
  }
  const total=days.length,resolved=on+late+leave;
  return{on,late,lateMin,absent,inc,leave,total,resolved,
    complete:total>0&&resolved===total,maxConsec,
    pendingFix:fixes.some(f=>f.e===e&&f.st==="Pending"&&f.d.slice(0,7)===y+"-"+pad2(m+1))};
}
/* Monthly bonus evaluation — automatic, rule-driven, never hand-assigned */
function evalMonth(e,y,m){
  const f=monthFacts(e,y,m),ym=y+"-"+pad2(m+1);
  const ended=y<TODAY.getFullYear()||(y===TODAY.getFullYear()&&m<TODAY.getMonth());
  let status,reason;
  if(!ended){status="Pending Evaluation";reason="Month in progress"}
  else if(f.lateMin>=POLICY.latenessForfeitMinutes){
    status="Voided";reason="Voided — "+POLICY.latenessForfeitMinutes+"-minute lateness threshold reached"}
  else if(f.maxConsec>=POLICY.consecutiveLateForfeitDays){
    status="Voided";reason="Voided — "+POLICY.consecutiveLateForfeitDays+" consecutive late days"}
  else if(!f.complete){status="Pending Evaluation";reason="Attendance records are incomplete"}
  else if(f.pendingFix){status="Pending Evaluation";reason="Unresolved attendance issue"}
  else{status="Qualified";reason="All conditions met"}
  const amount=status==="Qualified"?POLICY.monthlyBonusDays:0;
  return Object.assign({ym:ym,status:status,reason:reason,amount:amount,evaluatedAt:Date.now()},f);
}
/* Runs automatically for every past month; re-runs when corrections change history */
function ensureBonus(notify){
  const y=TODAY.getFullYear(),m=TODAY.getMonth();
  for(const e of emps){
    for(let i=6;i<=12;i++){                                 // Jun 2026 → Dec 2026 window
      const yy=2026,mm=i-1;
      if(yy>y||(yy===y&&mm>m))continue;                     // never evaluate future months
      const key=e.id+"|"+yy+"-"+pad2(mm+1);
      const prev=bonusLog[key],next=evalMonth(e.id,yy,mm);
      bonusLog[key]=next;
      if(notify&&prev&&prev.status!==next.status&&e.id===ME){
        if(next.status==="Qualified")pushNoti("bonus",next.ym+" attendance bonus earned",
          "+"+POLICY.monthlyBonusDays+" leave days credited for "+next.ym+".","#emp-leave");
        else if(next.status==="Voided")pushNoti("bonus",next.ym+" attendance bonus voided",
          next.reason+".","#emp-leave");
      }
    }
  }
}
function bonusRows(e){                                       // bonus history, newest first
  const out=[];
  for(const k in bonusLog)if(k.split("|")[0]===e)out.push(bonusLog[k]);
  return out.sort((a,b)=>a.ym<b.ym?1:-1);
}

/* ---------- 6. LEAVE BALANCES ---------- */
function leaveDays(from,to,e){                              // working days only (rest days + holidays excluded)
  if(!from||!to)return 0;
  const a=pdate(from),b=pdate(to);
  if(isNaN(a)||isNaN(b)||b<a)return 0;
  const sh=shiftOf(e||ME);let n=0;
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){
    const k=dkey(d);
    if(!isRest(k,sh)&&!holOn(k))n++;
  }
  return n;
}
function bal(eid){
  eid=eid||ME;
  const y=TODAY.getFullYear();
  const earned=round2(POLICY.annualAllowanceDays*TODAY.getMonth()/12); // accrued to end of last month
  let used=0,pend=0;
  for(const l of leaves){
    if(l.e!==eid||pdate(l.f).getFullYear()!==y)continue;
    const n=leaveDays(l.f,l.to,eid);
    if(l.st==="Approved")used+=n;else if(l.st==="Pending")pend+=n;
  }
  let bonusEarned=0,forfeited=0;
  for(const r of bonusRows(eid)){
    if(r.ym.slice(0,4)!==String(y))continue;
    if(r.status==="Qualified")bonusEarned+=r.amount;
    else if(r.status==="Voided")forfeited+=POLICY.monthlyBonusDays;
  }
  let entitled=earned+bonusEarned;
  if(POLICY.allowanceIncludesBonus)entitled=Math.min(entitled,POLICY.annualAllowanceDays);
  return{allowance:POLICY.annualAllowanceDays,earned:earned,used:used,pending:pend,
    bonusEarned:round2(bonusEarned),forfeited:round2(forfeited),
    entitled:round2(entitled),remaining:Math.max(0,round2(entitled-used-pend)),
    includesBonus:POLICY.allowanceIncludesBonus};
}

function periods(){
  const out=[],y0=TODAY.getFullYear(),m0=TODAY.getMonth();
  for(let i=0;i<8;i++){
    let y=y0,m=m0-Math.floor(i/2);
    while(m<0){m+=12;y--}
    const last=new Date(y,m+1,0).getDate(),mon=new Date(y,m,1).toLocaleDateString("en-PH",{month:"short"});
    for(const h of[{d1:16,d2:last},{d1:1,d2:15}]){
      const from=y+"-"+pad2(m+1)+"-"+pad2(h.d1),to=y+"-"+pad2(m+1)+"-"+pad2(h.d2);
      if(from>Y)continue;
      const st=to<Y?"Paid":(paid?"Processed":"Upcoming");
      out.push({label:`${mon} ${h.d1}–${h.d2}, ${y}`,from:from,to:to,st:st});
    }
  }
  return out;
}
function pay(e){
  const half=e.s/2,allow=Math.round(e.s*.04/2);
  const otHrs=(parseInt(e.id.slice(3),10)%3)*2,otRate=(e.s/2/22/8)*1.25,ot=Math.round(otHrs*otRate);
  const g=half+allow+ot;
  const sss=Math.min(e.s,30000)*.05/2,ph=e.s*.025/2,pg=Math.min(e.s*.02,200)/2,tx=Math.max(0,(e.s-20833)*.15)/2;
  const ded=sss+ph+pg+tx;
  return{half:half,allow:allow,otHrs:otHrs,ot:ot,g:g,sss:sss,ph:ph,pg:pg,tx:tx,ded:ded,net:g-ded};
}

  return`<svg viewBox="0 0 120 120" style="width:150px;display:block;margin:10px 0"><circle cx="60" cy="60" r="42" fill="none" stroke="var(--line)" stroke-width="14"/>${D.map((d,k)=>{const n=emps.filter(e=>e.d===d).length,p=n/t*100,x=n?`<circle cx="60" cy="60" r="42" pathLength="100" fill="none" stroke="${c[k]}" stroke-width="14" stroke-dasharray="${Math.max(p-1,0)} ${101-p}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`:"";o+=p;return x}).join("")}<text x="60" y="66" text-anchor="middle" style="fill:var(--tx);font:600 22px system-ui">${t}</text></svg>

function teamCal(){
  const y=TODAY.getFullYear(),m=TODAY.getMonth(),last=new Date(y,m+1,0).getDate(),sh=SHIFTS.day;
  let c=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="h">${x}</div>`).join("");
  c+=`<div class="h"></div>`.repeat(new Date(y,m,1).getDay());
  for(let d=1;d<=last;d++){
    const k=y+"-"+pad2(m+1)+"-"+pad2(d);
    const out=leaves.filter(l=>l.st==="Approved"&&k>=l.f&&k<=l.to).map(l=>ini(nm(l.e)));
    let cls="day";
    if(out.length)cls+=" late";
    else if(holOn(k))cls+=" hol";
    else if(isRest(k,sh))cls+=" rest";
    if(k===Y)cls+=" td";
    c+=`<button type="button" class="${cls}" disabled aria-label="${esc(longDate(k))}">${d}${out.length?`<small>${out.join(" ")}</small>`:""}</button>`;
  }
  return c;
}

function render(){
  const root=$("#root");if(!root)return;
  if(!session){root.innerHTML=loginView();document.body.classList.remove("menu-open");return}
  const raw=(location.hash||"").slice(1),parts=raw.split("-");
  let role=parts[0],page=parts[1];
  if(role!==session.role||!V[role]||!V[role][page]){
    const def=session.role==="emp"?"#emp-home":"#adm-dashboard";
    if(location.hash!==def){location.hash=def;return}
    role=session.role;page=session.role==="emp"?"home":"dashboard";
  }
  const N=role==="emp"?EMP:ADM;
  if(!page||!N[page])page=Object.keys(N)[0];
  root.innerHTML=shell(role,page,V[role][page]());
  if(location.hash!==lastV){
    lastV=location.hash;
    root.querySelectorAll("#app h1,#app .card,#app .eyebrow").forEach((el,i)=>{
      el.classList.add("rv");el.style.animationDelay=Math.min(i*60,500)+"ms"});
  }
  const s=$("#q");
  if(s)s.oninput=ev=>{q=ev.target.value;const p=ev.target.selectionStart;render();
    const n=$("#q");if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}};
  tickClock();
}
function tickClock(){
  const c=$("#clk");if(!c)return;
  const d=new Date();
  c.textContent=pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());
}

function printSlip(){
  document.body.classList.add("printing");
  const clean=()=>{document.body.classList.remove("printing");window.removeEventListener("afterprint",clean)};
  window.addEventListener("afterprint",clean);
  setTimeout(()=>{try{window.print()}finally{setTimeout(clean,1200)}},80);
}
function clockIn(){

  if(isRest(Y,sh)){toast("Today is your rest day — no shift scheduled",true);return}
  if(onLeave(ME,Y)){toast("You're on approved leave today — no clock-in needed",true);return}
  const r=recFor(ME,Y);
  if(r&&r.in){toast("You already clocked in at "+r.in,true);return}
  const t=t5();
  const rec=r||{e:ME,d:Y,in:null,out:null,note:""};
  if(!r)att.push(rec);
  rec.in=t;
  const late=Math.max(0,mins(t)-mins(sh.start));
  render();
  toast(late>0?"Clocked in at "+t+" · Late by "+late+" min":"Clocked in at "+t+" · On time",late>0);
}
function clockOut(){
  const r=recFor(ME,Y);
  if(!r||!r.in){toast("Clock in first — you can't clock out yet",true);return}
  if(r.out){toast("You already clocked out at "+r.out,true);return}
  const t=t5();
  if(mins(t)<mins(r.in)){toast("Clock-out can't be before your clock-in ("+r.in+")",true);return}
  r.out=t;
  const worked=mins(t)-mins(r.in);
  render();
  toast("Clocked out at "+t+" · "+Math.floor(worked/60)+"h "+(worked%60)+"m worked");
}
function decideFix(id,ok){
  const f=fixes.find(x=>x.id==id);if(!f||f.st!=="Pending")return;
  const rmEl=document.querySelector('[data-rm="fx'+id+'"]');
  const rm=rmEl&&rmEl.value?rmEl.value.trim():"";
  confirmDlg((ok?"Approve":"Reject")+" the attendance correction for "+nm(f.e)+" on "+shortDate(f.d)+"?",()=>{
    f.st=ok?"Approved":"Rejected";
    f.rm=rm||(ok?"Approved by HR":"Rejected by HR");
    f.rev=Y;
    if(ok){
      let r=recFor(f.e,f.d);
      if(!r){r={e:f.e,d:f.d,in:null,out:null,note:""};att.push(r)}
      if(f.ty==="Forgot to Clock In"||f.ty==="Incorrect Clock In")r.in=f.time;
      else r.out=f.time;
      r.note="Corrected from request #"+f.id;
      audit.unshift({ts:Date.now(),who:"HR Admin",act:"Attendance corrected",det:nm(f.e)+" · "+f.d+" · "+f.ty+" → "+f.time});
    }else{
      audit.unshift({ts:Date.now(),who:"HR Admin",act:"Correction rejected",det:nm(f.e)+" · "+f.d+" · "+f.ty});
    }
    if(f.e===ME)pushNoti("correction",ok?"Attendance correction approved":"Attendance correction rejected",
      shortDate(f.d)+" · "+f.ty+" — "+f.rm,"#emp-attendance");
    ensureBonus(true);
    render();
    toast("Correction "+f.st.toLowerCase()+" — attendance record updated");
  });
}
function decideLeave(id,ok){
  const l=leaves.find(x=>x.id==id);if(!l||l.st!=="Pending")return;
  const rmEl=document.querySelector('[data-rm="lv'+id+'"]');
  const rm=rmEl&&rmEl.value?rmEl.value.trim():"";
  confirmDlg((ok?"Approve":"Reject")+" "+nm(l.e)+"'s "+l.t.toLowerCase()+" leave ("+leaveDays(l.f,l.to,l.e)+" working days)?",()=>{
    l.st=ok?"Approved":"Rejected";
    l.rm=rm||(ok?"Approved by HR":"Rejected by HR");
    audit.unshift({ts:Date.now(),who:"HR Admin",act:"Leave "+l.st.toLowerCase(),
      det:nm(l.e)+" · "+l.t+" · "+shortDate(l.f)+" → "+shortDate(l.to)});
    if(l.e===ME)pushNoti("leave","Leave request "+l.st.toLowerCase(),
      l.t+" · "+shortDate(l.f)+" → "+shortDate(l.to)+" — "+l.rm,"#emp-leave");
    render();
    toast("Leave "+l.st.toLowerCase()+" — "+nm(l.e)+" notified");
  });
}
function decideReq(id,ok){
  const r=reqs.find(x=>x.id==id);if(!r||r.st!=="Pending")return;
  confirmDlg((ok?"Approve":"Reject")+" this "+r.t.toLowerCase()+" request?",()=>{
    r.st=ok?"Approved":"Rejected";
    audit.unshift({ts:Date.now(),who:"HR Admin",act:"Request "+r.st.toLowerCase(),det:nm(r.e)+" · "+r.t+" · "+shortDate(r.d)});
    if(r.e===ME)pushNoti("hr","Your "+r.t+" request was "+r.st.toLowerCase(),shortDate(r.d),"#emp-home");
    render();
    toast("Request "+r.st.toLowerCase());
  });
}

function empModal(id){
  const e=emp(id);
  modal(`<div class="fig">${esc(e.id)}</div><h3 style="margin:6px 0 12px">${esc(e.n)}</h3>
    ${[["Position",e.r],["Department",e.d],["Worker type",wtOf(e)],["Date hired",shortDate(e.j)],["Birthday",e.b],
       ["Monthly salary",PHP(e.s)],["Email",e.email],["Contact",e.ph||"—"],["Assigned shift",shiftOf(id).name+" · "+shiftOf(id).start+"–"+shiftOf(id).end]]
      .map(x=>`<div class="ls"><span class="mut">${x[0]}</span><br>${esc(x[1])}</div>`).join("")}
    <div class="ls">📄 Employment contract.pdf · 📄 Government IDs.pdf</div>`);
}
const fname=form=>{const el=form.querySelector('[type="file"]');return el&&el.files&&el.files[0]?el.files[0].name:""};
function act(a,i,el){
  const done=msg=>{render();if(msg)toast(msg)};
  if(a==="close"){closeModal();confirmCb=null;return}
  if(a==="cno"){closeModal();confirmCb=null;return}
  if(a==="cyes"){const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();return}
  if(a==="menu"){document.body.classList.toggle("menu-open");return}
  if(a==="theme"){toggleTheme();render();return}
  if(a==="bell"){notiOpen=!notiOpen;render();return}
  if(a==="readall"){notis.forEach(n=>n.read=true);render();toast("All notifications marked as read");return}
  if(a==="nti"){const n=notis.find(x=>x.id==i);if(!n)return;
    n.read=true;notiOpen=false;
    if(n.go&&n.go!==location.hash)location.hash=n.go;else render();
    return}
  if(a==="logout"){session=null;notiOpen=false;closeModal();document.body.classList.remove("menu-open");
    if(location.hash==="#login")render();else location.hash="#login";
    toast("Signed out");return}
  if(a==="demo"){const acc=ACCOUNTS[+i];const u=$("#lgU"),p=$("#lgP");
    if(u)u.value=acc.user;if(p)p.value=acc.pass;
    clearErr(u?u.closest("form"):null);toast("Credentials filled — press Sign in");return}
  if(a==="vis"){const t=document.getElementById(i);if(!t)return;
    const on=t.type==="password";t.type=on?"text":"password";
    const b=document.querySelector('[data-a="vis"][data-i="'+i+'"]');if(b)b.textContent=on?"Hide":"Show";return}
  if(a==="forgot"){forgotView();return}
  if(a==="in"){clockIn();return}
  if(a==="out"){clockOut();return}
  if(a==="calp"){calMove(-1);return}
  if(a==="caln"){calMove(1);return}
  if(a==="caltoday"){const k=Y.slice(0,7);
    if(k>=POLICY.minMonth&&k<=POLICY.maxMonth){calY=TODAY.getFullYear();calM=TODAY.getMonth();selDate=null;render()}
    else toast("Attendance data starts in June 2026",true);
    return}
  if(a==="day"){selDate=i;render();dayModal(i);return}
  if(a==="pol"){POLICY.allowanceIncludesBonus=!POLICY.allowanceIncludesBonus;ensureBonus(false);render();
    toast("Rule: bonus is now "+(POLICY.allowanceIncludesBonus?"counted inside":"additional to")+" the "+POLICY.annualAllowanceDays+"-day allowance");return}
  if(a==="editprof"){editProfView();return}
  if(a==="2fa"){const e=emp(ME);e.twofa=!e.twofa;render();toast("2-step verification "+(e.twofa?"enabled":"disabled"));return}
  if(a==="signoutall"){confirmDlg("Sign out all other sessions and devices?",()=>toast("Other sessions signed out (demo)"));return}
  if(a==="slip"){const p=i.split("|");modal(slipDoc(p[0],p.slice(1).join("|")),{wide:true,noClose:true});return}
  if(a==="printslip"){const p=i.split("|");modal(slipDoc(p[0],p.slice(1).join("|")),{wide:true,noClose:true});printSlip();return}
  if(a==="print"){printSlip();return}
  if(a==="dl"||a==="ex"){toast("Download started (demo)");return}
  if(a==="ap"||a==="rj"){decideReq(i,a==="ap");return}
  if(a==="lvap"||a==="lvrj"){decideLeave(i,a==="lvap");return}
  if(a==="fxap"||a==="fxrj"){decideFix(i,a==="fxap");return}
  if(a==="del"){confirmDlg("Remove "+nm(i)+" from the employee directory?",()=>{
      emps=emps.filter(e=>e.id!==i);render();toast("Employee removed")});return}
  if(a==="view"){empModal(i);return}
  if(a==="run"){busy(el,"Processing…",900,()=>{
      paid=true;
      pushNoti("payslip","Payslip for "+periods()[0].label+" is available","Net pay has been calculated for the whole team.","#emp-payslips");
      render();toast("Payroll processed")});return}
}

/* ---------- FORMS ---------- */
document.addEventListener("click",ev=>{
  if(ev.target.classList&&ev.target.classList.contains("mb")){closeModal();confirmCb=null;return}
  const b=ev.target.closest?ev.target.closest("[data-a]"):null;
  if(!b)return;
  ev.preventDefault();
  try{act(b.dataset.a,b.dataset.i,b)}
  catch(err){console.error(err);toast("Something went wrong",true)}
});
const sc=$("#sc");if(sc)sc.addEventListener("click",()=>document.body.classList.remove("menu-open"));
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Escape")return;
  if($("#md")&&$("#md").innerHTML){closeModal();confirmCb=null;return}
  if(notiOpen){notiOpen=false;render();return}
  document.body.classList.remove("menu-open");
});
function liveDays(ev){
  const el=ev.target;
  if(!el.dataset||el.dataset.live===undefined)return;
  const form=el.form||el.closest("form");if(!form)return;
  const box=form.querySelector("#lvDays");if(!box)return;
  const get=n=>{const x=form.querySelector('[name="'+n+'"]');return x?x.value:""};
  const from=get("f"),to=get("to"),target=get("e")||ME;
  if(!from||!to){
    box.textContent="Pick your dates — the number of leave days is calculated automatically (rest days and holidays are excluded).";
    return}
  const n=leaveDays(from,to,target),b=bal(target);
  box.innerHTML=`<b style="color:var(--tx)">${n} leave day${n===1?"":"s"}</b> — rest days and holidays are excluded. Available right now: <b style="color:var(--tx)">${b.remaining} days</b>.`;
}
document.addEventListener("input",liveDays);
document.addEventListener("change",liveDays);
document.addEventListener("change",ev=>{
  const t=ev.target;if(!t.classList||!t.classList.contains("wtsel"))return;
  const e=emps.find(x=>x.id===t.dataset.i);if(!e)return;
  e.wt=t.value;toast(e.n+" set as "+e.wt);
});

document.addEventListener("submit",ev=>{
  const k=ev.target.dataset.f;if(!k)return;
  ev.preventDefault();
  const form=ev.target;
  const f=Object.fromEntries(new FormData(form).entries());
  const btn=form.querySelector('button[type="submit"]')||form.querySelector("button.pri");
  clearErr(form);
  try{
    /* --- login --- */
    if(k==="login"){
      if(!String(f.u||"").trim())return errBox(form,"Enter your email or username.");
      if(!String(f.p||""))return errBox(form,"Enter your password.");
      busy(btn,"Signing in…",750,()=>{
        const a=auth(f.u,f.p);
        if(!a){errBox(form,"Incorrect email/username or password. Use a demo account below.");return}
        session={role:a.role,id:a.id};notiOpen=false;
        const def=a.role==="emp"?"#emp-home":"#adm-dashboard";
        toast("Welcome back, "+(a.role==="emp"?emp(ME).n.split(" ")[0]:"HR Admin"));
        if(location.hash===def)render();else location.hash=def;
      });
      return;
    }
    /* --- forgot password --- */
    if(k==="forgot"){
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.u||"").trim()))
        return errBox(form,"Enter a valid email address.");
      busy(btn,"Sending…",700,()=>{
        const md=$("#md");
        if(md)md.innerHTML=`<div class="fig">RESET LINK SENT</div><h3 style="margin:8px 0">Check your inbox</h3>
          <p class="mut">If an account exists for <b style="color:var(--tx)">${esc(String(f.u).trim())}</b>, a password reset link has been sent. (Demo — no email is actually sent.)</p>
          <div class="mact"><button class="pri" data-a="close">Back to sign in</button></div>`;
        toast("Reset link sent");
      });
      return;
    }
    /* --- leave request (employee + admin on behalf) --- */
    if(k==="leave"){
      const target=f.e||ME,b=bal(target);
      if(!f.f||!f.to)return errBox(form,"Choose both a start and an end date.");
      if(f.to<f.f)return errBox(form,"The end date must be on or after the start date.");
      if(f.f<Y)return errBox(form,"The start date can't be in the past.");
      const n=leaveDays(f.f,f.to,target);
      if(n<1)return errBox(form,"That range contains no working days — rest days and holidays don't count.");
      if(n>b.remaining)return errBox(form,"Not enough leave: you requested "+n+" day(s) but only "+b.remaining+" are available.");
      const clash=leaves.find(l=>l.e===target&&l.st!=="Rejected"&&overlaps(f.f,f.to,l.f,l.to));
      if(clash)return errBox(form,"This overlaps your "+clash.t.toLowerCase()+" leave ("+shortDate(clash.f)+" → "+shortDate(clash.to)+", "+clash.st.toLowerCase()+").");
      busy(btn,"Submitting…",600,()=>{
        leaves.unshift({id:Date.now(),e:target,t:f.t,f:f.f,to:f.to,st:"Pending",sub:Date.now(),
          why:String(f.why||"").trim(),rm:"",file:fname(form)});
        if(target===ME)pushNoti("leave","Leave request submitted",
          f.t+" · "+shortDate(f.f)+" → "+shortDate(f.to)+" ("+n+" days)","#emp-leave");
        render();
        toast("Leave request sent — "+n+" day(s) pending approval");
      });
      return;
    }
    /* --- attendance correction --- */
    if(k==="fix"){
      if(!f.d)return errBox(form,"Choose the date of the attendance record.");
      if(f.d>Y)return errBox(form,"The attendance date can't be in the future.");
      if(f.d<POLICY.dataStart)return errBox(form,"Attendance records start from "+shortDate(POLICY.dataStart)+".");
      if(!f.time)return errBox(form,"Enter the requested time.");
      if(!f.why||String(f.why).trim().length<5)return errBox(form,"Please give a short reason (at least 5 characters).");
      const dup=fixes.find(x=>x.e===ME&&x.d===f.d&&x.st==="Pending");
      if(dup)return errBox(form,"You already have a pending correction for "+shortDate(f.d)+" — wait for HR to review it.");
      busy(btn,"Submitting…",600,()=>{
        fixes.unshift({id:Date.now(),e:ME,d:f.d,ty:f.ty,time:f.time,why:String(f.why).trim(),
          file:fname(form),st:"Pending",sub:Date.now(),rm:"",rev:null});
        render();
        toast("Correction sent to HR — status: Pending");
      });
      return;
    }
    /* --- add employee (admin) --- */
    if(k==="emp"){
      if(!String(f.n||"").trim())return errBox(form,"Enter the employee's full name.");
      if(!String(f.r||"").trim())return errBox(form,"Enter a position.");
      if(!f.s||Number(f.s)<=0)return errBox(form,"Enter a valid monthly salary.");
      busy(btn,"Adding…",500,()=>{
        const id="HV-0"+(10+emps.length);
        emps.push({id:id,n:String(f.n).trim(),r:String(f.r).trim(),d:f.d,wt:WT.includes(f.wt)?f.wt:"Employee",s:Number(f.s),j:Y,b:"01-01",
          email:String(f.n).trim().toLowerCase().replace(/\s+/g,".")+"@hive.com",
          ph:"",addr:"",ec:"",sh:"day",st:"Probationary",pass:"hive123",twofa:false});
        render();toast("Employee added · "+id);
      });
      return;
    }
    /* --- announcement (admin) --- */
    if(k==="ann"){
      if(!String(f.t||"").trim())return errBox(form,"Enter a title.");
      if(!String(f.b||"").trim())return errBox(form,"Write the announcement message.");
      busy(btn,"Posting…",500,()=>{
        ann.unshift({id:Date.now(),t:String(f.t).trim(),b:String(f.b).trim(),d:Y,
          pri:f.pri||"Normal",pin:!!f.pin,by:"HR Admin"});
        pushNoti("announcement","New announcement: "+String(f.t).trim(),String(f.b).trim().slice(0,90),"#emp-home");
        render();toast("Announcement posted to everyone's home page");
      });
      return;
    }
    /* --- change password --- */
    if(k==="pw"){
      const me=emp(ME);
      if(!f.cur)return errBox(form,"Enter your current password.");
      if(f.cur!==me.pass)return errBox(form,"Your current password is incorrect.");
      if(!f.new||String(f.new).length<8)return errBox(form,"The new password must be at least 8 characters.");
      if(!/[a-zA-Z]/.test(f.new)||!/\d/.test(f.new))return errBox(form,"Include at least one letter and one number.");
      if(f.new!==f.rep)return errBox(form,"The new passwords don't match.");
      if(f.new===f.cur)return errBox(form,"Choose a password different from your current one.");
      busy(btn,"Updating…",600,()=>{
        me.pass=String(f.new);render();toast("Password updated successfully");
      });
      return;
    }
    /* --- edit profile --- */
    if(k==="prof"){
      if(!String(f.ph||"").trim())return errBox(form,"Contact number is required.");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.email||"").trim()))return errBox(form,"Enter a valid email address.");
      if(!String(f.addr||"").trim())return errBox(form,"Address is required.");
      if(!String(f.ec||"").trim())return errBox(form,"Emergency contact is required.");
      busy(btn,"Saving…",500,()=>{
        const me=emp(ME);
        me.ph=String(f.ph).trim();me.email=String(f.email).trim();
        me.addr=String(f.addr).trim();me.ec=String(f.ec).trim();
        closeModal();render();toast("Contact details updated");
      });
      return;
    }
  }catch(err){console.error(err);toast("Something went wrong",true)}
});

function boot(){
  try{const t=localStorage.getItem("hive.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
  genAtt();seedME();ensureBonus(false);
}
addEventListener("hashchange",()=>{
  notiOpen=false;document.body.classList.remove("menu-open");
  render();scrollTo(0,0);
});
setInterval(tickClock,1000);
boot();render();
